services:
  # =======================================================
  # EcoPulse AI - FastAPI Backend Web Service
  # =======================================================
  - type: web
    name: ecopulse-backend
    runtime: python
    region: oregon
    rootDir: backend
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn app.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: ENVIRONMENT
        value: production
      - key: CORS_ORIGINS
        value: "*"
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: ecopulse_ai
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: WEATHER_API_PROVIDER
        value: open-meteo
      - key: SIMULATOR_AUTO_START
        value: "false"

  # =======================================================
  # EcoPulse AI - React + Vite Frontend Static Site
  # =======================================================
  - type: web
    name: ecopulse-frontend
    runtime: static
    region: oregon
    rootDir: frontend
    plan: free
    buildCommand: "npm install && npm run build"
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: ecopulse-backend
          property: host
